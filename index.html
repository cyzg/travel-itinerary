<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>天津两日游 · 3人行</title>
<style>
  :root{
    --paper:#F1E8D6;
    --paper-deep:#E7DAC0;
    --card:#FBF6EA;
    --ink:#20293A;
    --ink-soft:#5B5546;
    --brick:#A13D2C;
    --brass:#B98A2E;
    --line:#C9BB9C;
    --pending-bg:#EFE6D0;
    --pending-border:#C9BB9C;
  }
  :root.theme-night{
    --paper:#181C27;
    --paper-deep:#20263380;
    --card:#232A3A;
    --ink:#EDE6D6;
    --ink-soft:#B8AE97;
    --brick:#E2694F;
    --brass:#E3B65B;
    --line:#3B4256;
    --pending-bg:#2A2F40;
    --pending-border:#454C63;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--paper);}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    line-height:1.6;
    padding-bottom:60px;
    transition:background .4s ease,color .4s ease;
  }
  a{color:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px;}

  /* ---- top meta ---- */
  .topbar{
    padding:28px 20px 8px;
    text-align:center;
  }
  .topbar h1{
    font-size:22px;
    font-weight:800;
    letter-spacing:.02em;
  }
  .topbar .meta{
    margin-top:6px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .topbar .tz-note{
    margin-top:4px;
    font-size:11.5px;
    color:var(--ink-soft);
    opacity:.8;
  }

  /* ---- 此刻关注 ---- */
  .focus-card{
    margin:14px auto 0;
    max-width:720px;
    background:linear-gradient(135deg,var(--brick),#7a2c1f);
    color:#F5EEDD;
    border-radius:18px;
    padding:26px 24px 22px;
    box-shadow:0 14px 30px rgba(32,20,10,0.25);
  }
  :root.theme-night .focus-card{
    background:linear-gradient(135deg,#5b2419,#331209);
  }
  .focus-label{
    font-size:12.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    opacity:.85;
    margin-bottom:6px;
  }
  .focus-name{
    font-size:24px;
    font-weight:800;
    margin-bottom:2px;
  }
  .focus-when{
    font-size:13px;
    opacity:.85;
    margin-bottom:18px;
  }
  .countdown{
    display:flex;
    gap:14px;
  }
  .cd-unit{
    flex:1;
    background:rgba(255,255,255,0.12);
    border-radius:12px;
    padding:10px 4px;
    text-align:center;
  }
  .cd-num{
    font-size:28px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .cd-unit-label{
    font-size:11px;
    opacity:.8;
    margin-top:2px;
  }
  .focus-done{
    font-size:18px;
    font-weight:700;
    padding:10px 0 4px;
  }

  /* ---- section shell ---- */
  section{
    max-width:760px;
    margin:44px auto 0;
    padding:0 20px;
  }
  .section-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:4px;
  }
  .section-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }

  /* ---- overview map ---- */
  .map-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 8px 6px;
  }
  .map-card svg{width:100%;height:auto;display:block;}
  .map-legend{
    display:flex;
    gap:18px;
    padding:10px 14px 14px;
    font-size:12.5px;
    color:var(--ink-soft);
    flex-wrap:wrap;
  }
  .map-legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

  /* ---- bookings ---- */
  .booking-list{display:flex;flex-direction:column;gap:10px;}
  .booking{
    border-radius:14px;
    padding:14px 16px;
    border:1px solid var(--line);
    background:var(--card);
  }
  .booking.pending{
    background:var(--pending-bg);
    border:1px dashed var(--pending-border);
  }
  .booking-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .booking-type{font-size:13px;color:var(--ink-soft);}
  .booking-status{
    font-size:11.5px;
    padding:2px 9px;
    border-radius:20px;
    font-weight:600;
  }
  .booking.pending .booking-status{background:transparent;color:var(--brass);border:1px solid var(--brass);}
  .booking:not(.pending) .booking-status{background:var(--brick);color:#F5EEDD;}
  .booking-title{font-size:16.5px;font-weight:700;margin-top:4px;}
  .booking-detail{font-size:13.5px;color:var(--ink-soft);margin-top:3px;}

  /* ---- day itinerary ---- */
  .day-block{margin-bottom:40px;}
  .day-block:last-child{margin-bottom:0;}
  .day-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:4px;
  }
  .day-heading h3{font-size:19px;font-weight:800;}
  .day-date{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}

  details.day-map{
    margin-bottom:18px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--card);
    overflow:hidden;
  }
  details.day-map summary{
    cursor:pointer;
    list-style:none;
    padding:12px 16px;
    font-size:13.5px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  details.day-map summary::-webkit-details-marker{display:none;}
  details.day-map summary::after{content:"展开 ▾";color:var(--ink-soft);font-weight:500;font-size:12px;}
  details.day-map[open] summary::after{content:"收起 ▴";}
  .day-map-body{padding:0 14px 14px;}
  .day-map-body svg{width:100%;height:auto;display:block;margin-bottom:10px;}
  .nav-all-row{display:flex;gap:10px;flex-wrap:wrap;}
  .nav-all-btn{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    padding:9px 16px;
    border-radius:20px;
    text-decoration:none;
    background:var(--ink);
    color:var(--paper);
  }
  .nav-all-btn.bmap{background:var(--brass);color:#20293A;}
  :root.theme-night .nav-all-btn{background:var(--brass);color:#181C27;}
  :root.theme-night .nav-all-btn.bmap{background:var(--brick);color:#181C27;}

  .timeline{
    position:relative;
    padding-left:26px;
    border-left:2px solid var(--line);
  }
  .stop{position:relative;padding-bottom:28px;}
  .stop:last-child{padding-bottom:0;}
  .stop::before{
    content:"";
    position:absolute;
    left:-32px;top:4px;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--brick);
    border:2px solid var(--paper);
    box-shadow:0 0 0 1px var(--brick);
  }
  .stop.day2::before{background:var(--brass);box-shadow:0 0 0 1px var(--brass);}
  .stop-row{display:flex;gap:14px;}
  .stop-time{
    flex:0 0 52px;
    font-weight:800;
    font-size:14px;
    color:var(--brick);
    padding-top:1px;
  }
  .stop.day2 .stop-time{color:var(--brass);}
  .stop-body{flex:1;}
  .stop-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .stop-name{font-size:16.5px;font-weight:700;}
  .nav-chips{display:inline-flex;gap:6px;}
  .nav-chip{
    font-size:11px;
    font-weight:700;
    text-decoration:none;
    padding:2px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .nav-chip.amap{color:var(--brick);border-color:var(--brick);}
  .nav-chip.bmap{color:var(--brass);border-color:var(--brass);}
  .stop-desc{font-size:13.8px;color:var(--ink-soft);margin-top:4px;max-width:540px;}
  .stop-tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;}
  .stop-tag{
    font-size:11.5px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:2px 9px;
    border-radius:20px;
  }
  .stop-tag.book{color:var(--brick);border-color:var(--brick);font-weight:600;}
  :root.theme-night .stop-tag.book{color:var(--brick);border-color:var(--brick);}

  /* ---- todo ---- */
  .todo-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
  .todo-list li{
    font-size:14.5px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    display:flex;
    gap:10px;
  }
  .todo-list li::before{content:"·";font-weight:900;color:var(--brass);}

  /* ---- tips ---- */
  .tips-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
  .tips-list li{
    font-size:14px;
    color:var(--ink-soft);
    padding-left:20px;
    position:relative;
  }
  .tips-list li::before{
    content:"※";
    position:absolute;left:0;top:0;
    color:var(--brass);
  }

  footer{
    max-width:760px;
    margin:50px auto 0;
    padding:18px 20px 0;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>天津两日游</h1>
  <div class="meta">3人 · 2026年9月12日(周六)– 9月13日(周日)</div>
  <div class="tz-note">页面所有时间均为天津当地时间(UTC+8)</div>
</div>

    <div class="map-legend">
      <span><i class="dot" style="background:var(--brick)"></i>Day 1 · 老城与租界</span>

    </div>
  </div>
</section>

<section id="bookings">
  <div class="section-title">已确认 / 待确认</div>
  <div class="section-sub">地址与联系方式以订单为准,截图发我后我来补全</div>
  <div class="booking-list" id="bookingList"></div>
</section>

<section id="itinerary">
  <div class="section-title">逐日行程</div>

<section id="todo">
  <div class="section-title">待办清单</div>

</section>

  <div class="section-title">实用贴士</div>
  <ul class="tips-list" id="tipsList"></ul>
</section>

<footer>天津两日游 · 3人行</footer>

    '买返程高铁票',
    '买天津之眼门票(建议线上)',
    '买瓷房子门票(建议线上)',
    '订好 / 买好后告诉我,我来更新页面'
  ];

  var tips = [
    '9月天津早晚微凉、白天舒适,建议穿好走的鞋,行程以步行 + 地铁 + 打车为主,不需要租车。',
    '支付以手机支付为主,建议备一点现金以防万一。',
    '天津之眼、瓷房子建议提前在线购票,避免现场排队,尤其是周末。',
    '天津之眼最佳观赏时间是日落前后,可以留意一下当天日落时间再决定要不要往后调。',
    '退房后可以把行李寄存在酒店或天津站的寄存柜,轻装完成 Day2 行程。',
    '古文化街、南市食品街的老字号店铺高峰期容易排队,可以错峰前往。'
  ];

  function amapUrl(query){
    return 'https://uri.amap.com/search?keyword=' + encodeURIComponent(query) + '&city=' + encodeURIComponent('天津') + '&callnative=1&src=travel-itinerary';
  }
  function amapAreaUrl(day){
    return 'https://uri.amap.com/search?keyword=' + encodeURIComponent(day.area) + '&city=' + encodeURIComponent('天津') + '&view=list&callnative=1&src=travel-itinerary';
  }
  function bmapUrl(query){
    return 'https://api.map.baidu.com/place/search?query=' + encodeURIComponent(query) + '&region=' + encodeURIComponent('天津') + '&output=html&src=' + encodeURIComponent('webapp.travel.itinerary');
  }
  function bmapAreaUrl(day){
    return 'https://api.map.baidu.com/place/search?query=' + encodeURIComponent(day.area) + '&region=' + encodeURIComponent('天津') + '&output=html&src=' + encodeURIComponent('webapp.travel.itinerary');
  }

  function miniMapSvg(day){
    var color = day.id === 1 ? 'var(--brick)' : 'var(--brass)';
    var n = day.stops.length;
    var pts = day.stops.map(function(s, i){
      var x = 40 + i * ((620) / (n - 1));
      var y = (i % 2 === 0) ? 60 : 110;
      return {x:x, y:y, name:s.name};
    });
    var d = 'M' + pts[0].x + ',' + pts[0].y;
    for (var i=1;i<pts.length;i++){ d += ' Q' + (pts[i-1].x+30) + ',' + (pts[i-1].y-20) + ' ' + pts[i].x + ',' + pts[i].y; }
    var circles = pts.map(function(p,i){
      return '<g transform="translate(' + p.x + ',' + p.y + ')">' +
        '<circle r="8" fill="' + color + '"/>' +
        '<text y="-14" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">' + p.name + '</text>' +
        '</g>';
    }).join('');
    return '<svg viewBox="0 0 700 150" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" filter="url(#rough)"/>' +
      circles + '</svg>';
  }

  function renderBookings(){
    var el = document.getElementById('bookingList');
    el.innerHTML = bookings.map(function(b){
      var navHtml = b.mapQuery ? (
        '<div class="stop-tags"><span class="nav-chips">' +
        '<a class="nav-chip amap" href="' + amapUrl(b.mapQuery) + '" target="_blank" rel="noopener">高德 →</a>' +
        '<a class="nav-chip bmap" href="' + bmapUrl(b.mapQuery) + '" target="_blank" rel="noopener">百度 →</a>' +
        '</span></div>'
      ) : '';
      return '<div class="booking ' + (b.status === 'pending' ? 'pending' : '') + '">' +
        '<div class="booking-top"><span class="booking-type">' + b.type + '</span>' +
        '<span class="booking-status">' + (b.status === 'pending' ? '待确认' : '已确认') + '</span></div>' +
        '<div class="booking-title">' + b.title + '</div>' +
        '<div class="booking-detail">' + b.detail + '</div>' +
        navHtml +
        '</div>';
    }).join('');
  }

  function renderDays(){
    var el = document.getElementById('dayBlocks');
    el.innerHTML = days.map(function(day){
      var stopsHtml = day.stops.map(function(s){
        var tagsHtml = s.tags.map(function(t){
          return '<span class="stop-tag' + (t === '需提前订票' ? ' book' : '') + '">' + t + '</span>';
        }).join('');
        return '<div class="stop ' + (day.id === 2 ? 'day2' : '') + '">' +
          '<div class="stop-row">' +
          '<div class="stop-time">' + s.time + '</div>' +
          '<div class="stop-body">' +
          '<div class="stop-name-row"><span class="stop-name">' + s.name + '</span>' +
          '<span class="nav-chips">' +
          '<a class="nav-chip amap" href="' + amapUrl(s.mapQuery) + '" target="_blank" rel="noopener">高德 →</a>' +
          '<a class="nav-chip bmap" href="' + bmapUrl(s.mapQuery) + '" target="_blank" rel="noopener">百度 →</a>' +
          '</span></div>' +
          '<div class="stop-desc">' + s.desc + '</div>' +
          '<div class="stop-tags">' + tagsHtml + '</div>' +
          '</div></div></div>';
      }).join('');

      return '<div class="day-block">' +
        '<div class="day-heading"><h3>' + day.title + '</h3></div>' +
        '<div class="day-date">' + day.dateLabel + '</div>' +
        '<details class="day-map"><summary>展开当日路线地图</summary>' +
        '<div class="day-map-body">' + miniMapSvg(day) +
        '<div class="nav-all-row">' +
        '<a class="nav-all-btn amap" href="' + amapAreaUrl(day) + '" target="_blank" rel="noopener">高德地图 · 今日区域</a>' +
        '<a class="nav-all-btn bmap" href="' + bmapAreaUrl(day) + '" target="_blank" rel="noopener">百度地图 · 今日区域</a>' +
        '</div></div></details>' +
        '<div class="timeline">' + stopsHtml + '</div>' +
        '</div>';
    }).join('');
  }

  function renderTodo(){
    document.getElementById('todoList').innerHTML = todos.map(function(t){ return '<li>' + t + '</li>'; }).join('');
  }
  function renderTips(){
    document.getElementById('tipsList').innerHTML = tips.map(function(t){ return '<li>' + t + '</li>'; }).join('');
  }

  function allStopsFlat(){
    var out = [];
    days.forEach(function(day){
      day.stops.forEach(function(s){ out.push({name:s.name, iso:s.iso, dayTitle:day.title}); });
    });
    return out;
  }

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function tzFormat(iso){
    var d = new Date(iso);
    var fmt = new Intl.DateTimeFormat('zh-CN', {timeZone:'Asia/Shanghai', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false});
    return fmt.format(d) + '(天津时间)';
  }

  var flat = allStopsFlat();

  function updateCountdown(){
    var now = new Date();
    var next = null;
    for (var i=0;i<flat.length;i++){
      if (new Date(flat[i].iso) > now){ next = flat[i]; break; }
    }
    var focusCard = document.getElementById('focusCard');
    if (!next){
      document.getElementById('focusName').textContent = '行程已结束';
      document.getElementById('focusWhen').textContent = '祝旅途愉快 🎉';
      document.getElementById('countdown').style.display = 'none';
      return;
    }
    document.getElementById('focusName').textContent = next.name;
    document.getElementById('focusWhen').textContent = next.dayTitle + ' · ' + tzFormat(next.iso);
    var diff = new Date(next.iso) - now;
    var s = Math.max(0, Math.floor(diff / 1000));
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60); s -= m * 60;
    document.getElementById('cdDays').textContent = pad(d);
    document.getElementById('cdHours').textContent = pad(h);
    document.getElementById('cdMinutes').textContent = pad(m);
    document.getElementById('cdSeconds').textContent = pad(s);
  }

  function isDaytimeInTianjin(){
    var hourStr = new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Shanghai', hour:'numeric', hour12:false}).format(new Date());
    var hour = parseInt(hourStr, 10);
    return hour >= 6 && hour < 18;
  }
  function applyTheme(){
    document.documentElement.classList.toggle('theme-night', !isDaytimeInTianjin());
  }

  renderBookings();
  renderDays();
  renderTodo();
  renderTips();
  applyTheme();
  updateCountdown();
  setInterval(updateCountdown, 1000);
  setInterval(applyTheme, 60000);

})();
</script>

</body>
</html>
